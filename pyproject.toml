[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-markets-dashboard"
version = "0.1.0"
description = "Streamlit dashboard for AI prediction markets — model releases, regulation, capability milestones"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.35.0","httpx>=0.27.0","pandas>=2.0.0","python-dotenv>=1.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aimarkets"]
